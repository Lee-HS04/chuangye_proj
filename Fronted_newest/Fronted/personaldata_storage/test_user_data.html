<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员数据管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 20px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #1d1d1f;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-primary {
            background-color: #0071e3;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0077ed;
        }
        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }
        .btn-danger:hover {
            background-color: #ff453a;
        }
        .btn-secondary {
            background-color: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e0e0e0;
        }
        .btn-secondary:hover {
            background-color: #ebebeb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f5f5f7;
            font-weight: 600;
            font-size: 14px;
            color: #666;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background-color: rgba(52, 199, 89, 0.1);
            color: #34c759;
        }
        .status-inactive {
            background-color: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }
        .pagination button {
            padding: 8px 12px;
            font-size: 14px;
        }
        .pagination .active {
            background-color: #0071e3;
            color: white;
        }
        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
            font-size: 16px;
        }
        .user-details {
            margin-top: 8px;
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>管理员数据管理</h1>
        
        <div class="header-actions">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索用户...">
                <button class="btn-secondary" onclick="searchUsers()">搜索</button>
            </div>
            <div>
                <button class="btn-secondary" onclick="refreshData()">刷新数据</button>
                <button class="btn-danger" onclick="clearUserData()">清空数据</button>
            </div>
        </div>
        
        <div id="userData">
            <div class="empty-message">加载数据中...</div>
        </div>
    </div>
    
    <script>
        let userData = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        
        function showUserData() {
            // 从user_data.json文件读取数据
            fetch('user_data.json')
                .then(response => response.json())
                .then(data => {
                    userData = data.users || [];
                    renderTable(currentPage);
                })
                .catch(error => {
                    console.error('读取数据失败:', error);
                    document.getElementById('userData').innerHTML = '<div class="empty-message">读取数据失败，请检查文件路径</div>';
                });
        }
        
        function renderTable(page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedUsers = userData.slice(startIndex, endIndex);
            
            if (userData.length === 0) {
                document.getElementById('userData').innerHTML = '<div class="empty-message">暂无用户数据</div>';
                return;
            }
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortBy('id')">ID</th>
                            <th onclick="sortBy('username')">用户名</th>
                            <th>个人信息</th>
                            <th>上传记录</th>
                            <th>稳定度记录</th>
                            <th onclick="sortBy('created_at')">创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            paginatedUsers.forEach(user => {
                const personalInfo = user.personal_info || {};
                const uploadRecords = user.upload_records || [];
                const stabilityRecords = user.stability_records || [];
                
                tableHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>
                            <div>年龄: ${personalInfo.age || '未知'}</div>
                            <div>性别: ${personalInfo.gender === 'male' ? '男' : '女'}</div>
                            <div>运动时长: ${personalInfo.exercise || '未知'}</div>
                            <div>身份: ${personalInfo.identity || '未知'}</div>
                        </td>
                        <td>
                            <button class="btn-secondary" onclick="viewUploadRecords(${user.id})">
                                ${uploadRecords.length} 条记录
                            </button>
                        </td>
                        <td>
                            <button class="btn-secondary" onclick="viewStabilityRecords(${user.id})">
                                ${stabilityRecords.length} 条记录
                            </button>
                        </td>
                        <td>${new Date(user.created_at).toLocaleString()}</td>
                        <td>
                            <button class="btn-secondary" onclick="viewUserDetails(${user.id})">查看详情</button>
                        </td>
                    </tr>
                `;
            });
            
            tableHTML += `
                    </tbody>
                </table>
            `;
            
            // 添加分页
            const totalPages = Math.ceil(userData.length / itemsPerPage);
            tableHTML += `
                <div class="pagination">
                    <button ${page === 1 ? 'disabled' : ''} onclick="renderTable(${page - 1})">&lt; 上一页</button>
            `;
            
            for (let i = 1; i <= totalPages; i++) {
                tableHTML += `
                    <button class="${i === page ? 'active' : ''}" onclick="renderTable(${i})"><i>${i}</i></button>
                `;
            }
            
            tableHTML += `
                    <button ${page === totalPages ? 'disabled' : ''} onclick="renderTable(${page + 1})"><i>下一页 &gt;</i></button>
                </div>
            `;
            
            document.getElementById('userData').innerHTML = tableHTML;
        }
        
        function sortBy(column) {
            userData.sort((a, b) => {
                if (column === 'created_at') {
                    return new Date(a.created_at) - new Date(b.created_at);
                }
                return a[column]?.toString().localeCompare(b[column]?.toString()) || 0;
            });
            renderTable(1);
        }
        
        function searchUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = userData.filter(user => {
                return user.username.toLowerCase().includes(searchTerm) || 
                       user.id.toString().includes(searchTerm);
            });
            
            if (filteredUsers.length === 0) {
                document.getElementById('userData').innerHTML = '<div class="empty-message">未找到匹配的用户</div>';
                return;
            }
            
            userData = filteredUsers;
            renderTable(1);
        }
        
        function viewUserDetails(userId) {
            const user = userData.find(u => u.id == userId);
            if (user) {
                alert(`用户详情:\n\nID: ${user.id}\n用户名: ${user.username}\n创建时间: ${new Date(user.created_at).toLocaleString()}\n个人信息: ${JSON.stringify(user.personal_info, null, 2)}\n上传记录数: ${user.upload_records?.length || 0}\n稳定度记录数: ${user.stability_records?.length || 0}`);
            }
        }
        
        function viewUploadRecords(userId) {
            const user = userData.find(u => u.id == userId);
            if (user) {
                const uploadRecords = user.upload_records || [];
                if (uploadRecords.length === 0) {
                    alert('该用户暂无上传记录');
                    return;
                }
                
                let recordsHTML = `<div style="max-width: 600px; max-height: 400px; overflow-y: auto; padding: 20px;">`;
                recordsHTML += `<h3>上传记录 (${uploadRecords.length} 条)</h3>`;
                recordsHTML += `<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">`;
                recordsHTML += `<tr style="background-color: #f5f5f7;"><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">类型</th><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">文件名</th><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">上传时间</th><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">状态</th></tr>`;
                
                uploadRecords.forEach(record => {
                    recordsHTML += `<tr style="border-bottom: 1px solid #e0e0e0;">`;
                    recordsHTML += `<td style="padding: 8px;">${record.type}</td>`;
                    recordsHTML += `<td style="padding: 8px;"><a href="#" style="color: #0071e3; text-decoration: none;" onclick="alert('视频链接: ${record.file_name}'); return false;">${record.file_name}</a></td>`;
                    recordsHTML += `<td style="padding: 8px;">${new Date(record.upload_time).toLocaleString()}</td>`;
                    recordsHTML += `<td style="padding: 8px;">${record.status}</td>`;
                    recordsHTML += `</tr>`;
                });
                
                recordsHTML += `</table></div>`;
                
                // 创建弹出窗口
                const popup = window.open('', '上传记录', 'width=700,height=500');
                popup.document.write(`
                    <html>
                    <head>
                        <title>上传记录 - ${user.username}</title>
                        <style>
                            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; margin: 20px; }
                            h3 { color: #1d1d1f; margin-bottom: 15px; }
                            table { width: 100%; border-collapse: collapse; }
                            th, td { padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0; }
                            th { background-color: #f5f5f7; font-weight: 600; }
                            tr:hover { background-color: #f9f9f9; }
                            a { color: #0071e3; text-decoration: none; }
                            a:hover { text-decoration: underline; }
                        </style>
                    </head>
                    <body>
                        <button onclick="window.close()" style="margin-bottom: 15px; padding: 8px 16px; background-color: #f5f5f7; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer;">关闭</button>
                        ${recordsHTML}
                    </body>
                    </html>
                `);
                popup.document.close();
            }
        }
        
        function viewStabilityRecords(userId) {
            const user = userData.find(u => u.id == userId);
            if (user) {
                const stabilityRecords = user.stability_records || [];
                if (stabilityRecords.length === 0) {
                    alert('该用户暂无稳定度记录');
                    return;
                }
                
                let recordsHTML = `<div style="max-width: 600px; max-height: 400px; overflow-y: auto; padding: 20px;">`;
                recordsHTML += `<h3>稳定度记录 (${stabilityRecords.length} 条)</h3>`;
                recordsHTML += `<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">`;
                recordsHTML += `<tr style="background-color: #f5f5f7;"><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">稳定度</th><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">任务ID</th><th style="padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0;">时间</th></tr>`;
                
                stabilityRecords.forEach(record => {
                    recordsHTML += `<tr style="border-bottom: 1px solid #e0e0e0;">`;
                    recordsHTML += `<td style="padding: 8px;">${record.stability}%</td>`;
                    recordsHTML += `<td style="padding: 8px;">${record.task_id}</td>`;
                    recordsHTML += `<td style="padding: 8px;">${new Date(record.timestamp).toLocaleString()}</td>`;
                    recordsHTML += `</tr>`;
                });
                
                recordsHTML += `</table></div>`;
                
                // 创建弹出窗口
                const popup = window.open('', '稳定度记录', 'width=700,height=500');
                popup.document.write(`
                    <html>
                    <head>
                        <title>稳定度记录 - ${user.username}</title>
                        <style>
                            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; margin: 20px; }
                            h3 { color: #1d1d1f; margin-bottom: 15px; }
                            table { width: 100%; border-collapse: collapse; }
                            th, td { padding: 8px; text-align: left; border-bottom: 1px solid #e0e0e0; }
                            th { background-color: #f5f5f7; font-weight: 600; }
                            tr:hover { background-color: #f9f9f9; }
                        </style>
                    </head>
                    <body>
                        <button onclick="window.close()" style="margin-bottom: 15px; padding: 8px 16px; background-color: #f5f5f7; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer;">关闭</button>
                        ${recordsHTML}
                    </body>
                    </html>
                `);
                popup.document.close();
            }
        }
        
        function clearUserData() {
            if (confirm('确定要清空所有用户数据吗？')) {
                // 清空localStorage中的数据
                localStorage.removeItem('userData');
                // 重新加载页面以显示空数据
                location.reload();
            }
        }
        
        function refreshData() {
            showUserData();
        }
        
        // 初始显示
        showUserData();
    </script>
</body>
</html>
